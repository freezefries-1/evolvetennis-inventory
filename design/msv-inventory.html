function recalc(){
  const sum=$('#sum'); if(!sum) return;
  let sub=0, units=0;
  document.querySelectorAll('#mForm .line-row[data-line]').forEach(r=>{const q=+r.querySelector('[data-l=qty]').value||0, p=+r.querySelector('[data-l=price]').value||0; sub+=q*p; units+=q; r.querySelector('.line-total').textContent=sgd(q*p,2)});
  const extra=[...document.querySelectorAll('#mForm [data-x]')].reduce((a,i)=>a+(+i.value||0),0);
  sum.innerHTML=document.querySelector('#mForm [data-x]')?`<div><span>Subtotal · ${units} units</span><span>${sgd(sub,2)}</span></div><div><span>Additional Costs</span><span>${sgd(extra,2)}</span></div><div class="total"><span>Total Purchase Cost</span><span>${sgd(sub+extra,2)}</span></div>`:`<div><span>Units</span><span>${units}</span></div><div class="total"><span>Subtotal</span><span>${sgd(sub,2)}</span></div>`;
}

function toast(title,msg,tone){
  $('#toastRoot').innerHTML=`<div class="toast ${tone==='error'?'error':''}" role="status">${ic(tone==='error'?'circle-alert':tone==='info'?'info':'circle-check','i')}<div><b>${esc(title)}</b><span>${esc(msg||'')}</span></div></div>`; refreshIcons();
  clearTimeout(toast.t); toast.t=setTimeout(()=>$('#toastRoot').innerHTML='',4500);
}

/* ---------- Router & render ---------- */
const NAV=[['dashboard','Dashboard','layout-dashboard'],['inventory','Inventory','boxes'],['products','Products','package'],['purchases','Purchases','truck'],['suppliers','Suppliers','factory'],['sales','Sales','receipt'],['customers','Customers','users'],['reports','Reports','chart-column'],['settings','Settings','settings']];
const PARENT={product:'products',variant:'products',customer:'customers',purchase:'purchases',supplier:'suppliers'};
function route(){ const h=location.hash.slice(1); const m=h.match(/^(product|variant|purchase|supplier)-(.+)$/); if(m) return [m[1],m[2]]; return [PAGES[h]?h:'dashboard',null]; }
function render(){
  const [r,id]=route(), active=PARENT[r]||r, att=attention().length;
  $('#nav').innerHTML=NAV.map(([k,label,icon])=>`<a href="#${k}" ${k===active?'aria-current="page"':''}>${ic(icon)}<span>${label}</span>${k==='inventory'&&att?`<span class="count" title="Low or out of stock">${att}</span>`:''}</a>`).join('');
  $('#app').innerHTML=(Store.available?'':`<div class="notice">${ic('triangle-alert','i i-sm')}This browser is blocking storage. You can try things out, but changes will be lost when you close the page.</div>`)+PAGES[r](id);
  if(r==='inventory') renderInvTable();
  if(r==='purchases') renderPurTable();
  renderNotifications();
  refreshIcons(); $('#shell').classList.remove('open');
}
function refreshIcons(){ if(window.lucide) lucide.createIcons({attrs:{'stroke-width':1.75}}); }
function go(h){ if(location.hash==='#'+h) render(); else location.hash=h; window.scrollTo(0,0); }
let lastRoute='';
window.addEventListener('hashchange',()=>{const r=route()[0];if(r==='variant'&&lastRoute!=='variant')S.vtab='Overview';lastRoute=r;render();window.scrollTo(0,0)});

  resetInv:()=>{Object.assign(S.inv,blankInvFilters());render()},
  renameCat:d=>{const c=DB.categories.find(x=>x.id===d.id);showModal({title:'Rename category',narrow:true,save:'Save',body:fld('Category name',`<input class="input" name="name" value="${esc(c.name)}">`,{req:1}),onSave:form=>{const n=F(form,'name').value.trim();if(!n){fieldError(F(form,'name'),'Name cannot be blank.');return false}if(DB.categories.some(x=>x.id!==c.id&&x.name.toLowerCase()===n.toLowerCase())){fieldError(F(form,'name'),'That category already exists.');return false}c.name=n;persist();render();toast('Category updated',n);return true}})},
  deleteCat:d=>{const c=DB.categories.find(x=>x.id===d.id);confirmDialog({title:'Delete category?',body:`${esc(c.name)} has no products.`,confirm:'Delete Category',onConfirm:()=>{DB.categories=DB.categories.filter(x=>x.id!==c.id);persist();render();toast('Category deleted',c.name)}})},
  restoreSample:()=>confirmDialog({title:'Restore sample data?',body:'This replaces all products, suppliers, purchases and stock movements in this browser with the MSV sample data.',confirm:'Restore Sample Data',onConfirm:()=>{DB=seedDb();persist();render();toast('Sample data restored','')}}),
  clearData:()=>confirmDialog({title:'Clear all data?',body:'This removes every product, supplier, purchase and stock movement saved in this browser. Categories and currencies are kept. This can\'t be undone.',confirm:'Clear Data',onConfirm:()=>{DB=emptyDb();persist();go('products');toast('Data cleared','Add your first product to get started.')}}),
  addLine:(d,el)=>{const box=el.closest('.form-section').querySelector('.lines');const i=box.querySelectorAll('[data-line]').length;box.insertAdjacentHTML('beforeend',lineRow(box.dataset.kind,i,'',1,''));refreshIcons();recalc()},
  removeLine:(d,el)=>{el.closest('.line-row').remove();recalc()},
  sale:()=>openDemo('sale'), customer:()=>openDemo('customer'), export:()=>openDemo('export'),
};
document.addEventListener('click',e=>{
  if(e.target.closest('a[href^="#"]:not([data-action])')&&!e.target.closest('#mForm')) return;
  const el=e.target.closest('[data-action],[data-go],[data-variant],[data-product],[data-customer],[data-vtab],[data-rtab],[data-range],[data-sf],[data-pf],[data-ct],[data-sort],[data-scroll],[data-pstatus],[data-invview],[data-setstatus],[data-psort],[data-sstatus]');
  if(!el) return;
  const d=el.dataset;
  if(d.action){ if(['suggestSku','addVariantCard','removeVariantCard','addPLine','removePLine','newSupplierInline'].includes(d.action)) return; const fn=ACTIONS[d.action]; if(fn){ if(el.tagName==='A'&&d.action==='close'){closeModal();return} e.preventDefault(); fn(d,el);} return; }
  if(d.go){ if(d.status!==undefined) Object.assign(S.inv,blankInvFilters(),{status:d.status,view:'levels'}); if(d.view) S.inv.view=d.view; return go(d.go); }
  if(d.variant) return go('variant-'+d.variant);
  if(d.product) return go('product-'+d.product);
  if(d.customer){S.customer=d.customer;return go('customer');}
  if(d.vtab){S.vtab=d.vtab;return render();}
  if(d.rtab){S.rtab=d.rtab;return render();}
  if(d.range){S.range=d.range;return render();}
  if(d.sf){S.salesFilter=d.sf;return render();}
  if(d.pf){S.purchFilter=d.pf;return render();}
  if(d.ct){S.custType=d.ct;return render();}
  if(d.pstatus){S.prod.status=d.pstatus;return render();}
  if(d.invview){S.inv.view=d.invview;return render();}
  if(d.setstatus){Object.assign(S.inv,{status:d.setstatus,view:'levels'});return render();}
  if(d.psort){const f=S.pur;f.dir=f.sort===d.psort?-f.dir:1;f.sort=d.psort;return renderPurTable();}
  if(d.sstatus){S.sup.status=d.sstatus;return render();}
  if(d.sort){const f=S.inv;f.dir=f.sort===d.sort?-f.dir:1;f.sort=d.sort;return renderInvTable();}
  if(d.scroll){e.preventDefault();document.getElementById(d.scroll).scrollIntoView({behavior:'smooth',block:'start'});}
});
function rerenderKeepFocus(id){const el=$('#'+id),pos=el?el.selectionStart:0;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter){S.inv[t.dataset.filter]=t.value;rerenderKeepFocus('invQ');return}
  if(t.dataset.pfilter){S.pur[t.dataset.pfilter]=t.value;rerenderKeepFocus('purQ');return}
  if(t.id==='showInactive'){S.inv.showInactive=t.checked;render();return}
  if(t.id==='prodCat'){S.prod.cat=t.value;render();return}
  if(t.dataset.catgauge){const c=DB.categories.find(x=>x.id===t.dataset.catgauge);c.usesGauge=t.checked;persist();render();toast('Category updated',`${c.name} ${c.usesGauge?'now shows':'no longer shows'} the gauge field.`);return}
  if(t.closest('#mForm')&&modal&&modal.kind==='demo') recalc();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='invQ'){S.inv.q=t.value;renderInvTable();const rb=document.querySelector('[data-action=resetInv]');if(rb)rb.disabled=!filtersActive();return}
  if(t.id==='purQ'){S.pur.q=t.value;renderPurTable();const rb=document.querySelector('[data-action=resetPur]');if(rb)rb.disabled=!purFiltersActive();return}
  if(t.id==='supQ'){S.sup.q=t.value;rerenderKeepFocus('supQ');return}
  if(t.id==='prodQ'){S.prod.q=t.value;rerenderKeepFocus('prodQ');return}
  if(t.id==='custQ'){S.custQ=t.value;rerenderKeepFocus('custQ');return}
  if(t.closest('#mForm')&&modal&&modal.kind==='demo') recalc();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='mForm'){e.preventDefault();submitModal();return}
  if(e.target.id==='addCurForm'){e.preventDefault();const c=e.target.querySelector('[name=code]').value.trim().toUpperCase(),err=$('#curErr');
    if(!/^[A-Z]{3}$/.test(c)){err.textContent='Use a 3-letter code, e.g. AUD.';return}
    if(DB.currencies.includes(c)){err.textContent='That currency is already on the list.';return}
    DB.currencies.push(c);persist();render();toast('Currency added',c);return}
  if(e.target.id==='addCatForm'){e.preventDefault();const n=e.target.querySelector('[name=name]').value.trim(),err=$('#catErr');
    if(!n){err.textContent='Enter a category name.';return}
    if(DB.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){err.textContent='That category already exists.';return}
    DB.categories.push({id:uid('cat'),name:n,usesGauge:false});persist();render();toast('Category added',n);}
});
$('#globalSearch').addEventListener('submit',e=>{e.preventDefault();Object.assign(S.inv,blankInvFilters(),{q:$('#globalSearchInput').value,view:'levels'});$('#globalSearchInput').value='';go('inventory');});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(modal) closeModal(); hidePops(); }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#globalSearchInput').focus();}
});
$('#menuBtn').onclick=()=>$('#shell').classList.add('open');
$('#backdrop').onclick=()=>$('#shell').classList.remove('open');
function hidePops(){ $('#notifPop').hidden=true; $('#profilePop').hidden=true; }
function renderNotifications(){
  const att=attention(), out=att.filter(v=>v.qty<=0).length;
  $('#notifDot').hidden=!att.length;
  $('#notifPop').innerHTML=`<div class="pop-head">Notifications</div>
  ${att.length?`<button class="pop-item" data-go="inventory" data-status="attention"><span class="act-icon" style="background:var(--warn-bg);color:var(--warn-fg)">${ic('triangle-alert','i i-sm')}</span><span><b style="font-size:13.5px">${att.length} SKU${att.length===1?' needs':'s need'} reordering</b><small>${out} out of stock</small></span></button>`:`<div class="pop-item" style="cursor:default"><span class="act-icon" style="background:var(--ok-bg);color:var(--ok-fg)">${ic('circle-check','i i-sm')}</span><span><b style="font-size:13.5px">Stock levels look good</b><small>No SKU is at its reorder level</small></span></div>`}
  ${DB.purchases.some(p=>p.status==='Ordered')?`<button class="pop-item" data-go="purchases"><span class="act-icon" style="background:var(--info-bg);color:var(--info-fg)">${ic('ship','i i-sm')}</span><span><b style="font-size:13.5px">${DB.purchases.filter(p=>p.status==='Ordered').length} purchase${DB.purchases.filter(p=>p.status==='Ordered').length===1?'':'s'} on order</b><small>Mark as Received when the stock arrives</small></span></button>`:''}
  <button class="pop-item" data-go="sales"><span class="act-icon" style="background:var(--bad-bg);color:var(--bad-fg)">${ic('clock','i i-sm')}</span><span><b style="font-size:13.5px">INV-1087 is overdue</b><small>Sample data · Jakarta Tennis Supply</small></span></button>`;
}
$('#profilePop').innerHTML=`<div class="pop-head" style="flex-direction:column;align-items:flex-start;gap:0">Jasmine Koh<small class="muted" style="font-weight:500;font-size:12px">jasmine@msv-sea.com</small></div><div class="pop-sep"></div>
  <button class="pop-item" data-go="settings">${ic('user','i i-sm')}My profile</button><button class="pop-item" data-go="settings">${ic('settings','i i-sm')}Settings</button>`;
document.addEventListener('click',e=>{
  if(e.target.closest('#notifBtn')){const p=$('#notifPop');const h=p.hidden;hidePops();p.hidden=!h;return;}
  if(e.target.closest('#profileBtn')){const p=$('#profilePop');const h=p.hidden;hidePops();p.hidden=!h;return;}
  if(!e.target.closest('.pop')||e.target.closest('.pop-item')) hidePops();
});
/* Chart tooltips */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.innerHTML=t.dataset.tip;tip.hidden=false});
document.addEventListener('mousemove',e=>{if(tip.hidden)return;const w=tip.offsetWidth;let x=e.clientX+14;if(x+w>innerWidth-8)x=e.clientX-w-14;tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'});

persist();
lastRoute=route()[0];
render();
if(!window.lucide){ window.addEventListener('load',refreshIcons); }
</script>
