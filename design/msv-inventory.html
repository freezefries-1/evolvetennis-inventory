/* --- Adjust Stock (manual corrections) --- */
function openAdjust(variantId){
  const pick=!variantId;
  const v0=variantId?DB.variants.find(x=>x.id===variantId):null;
  const options=DB.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const vs=variantsOf(p.id);return vs.length?`<optgroup label="${esc(p.name)}">${vs.map(v=>`<option value="${v.id}">${esc(p.name)} ${esc(variantLabel(v))} · ${esc(v.sku)} · ${v.qty} on hand</option>`).join('')}</optgroup>`:''}).join('');
  showModal({title:'Adjust Stock',desc:'Record a manual correction. The change is added to the stock movement history as a new movement; past movements are never edited.',narrow:true,save:'Save Adjustment',
    body:`<div class="form-grid">
      ${pick?fld('Product Variant',`<select class="select" name="variantId"><option value="">Choose a SKU…</option>${options}</select>`,{req:1,span:1}):`<input type="hidden" name="variantId" value="${v0.id}"><div class="span-2"><b>${esc(productOf(v0).name)} ${esc(variantLabel(v0))}</b><div class="mono">${esc(v0.sku)}</div></div>`}
      <div class="field span-2"><span class="field-label">Adjustment Type</span><div class="seg" role="radiogroup" id="adjType">${[['increase','Increase Stock'],['decrease','Decrease Stock'],['set','Set Exact Quantity']].map(([k,l],i)=>`<button type="button" role="radio" aria-pressed="${i===1}" data-adjtype="${k}">${l}</button>`).join('')}</div><input type="hidden" name="type" value="decrease"></div>
      ${fld('<span id="qtyLabel">Quantity to remove</span>',`<input class="input" type="number" min="0" step="1" name="qty" inputmode="numeric" placeholder="e.g. 2">`,{req:1})}
      ${fld('Date',`<input class="input" type="date" name="date" value="${todayISO()}" max="${todayISO()}">`,{req:1})}
      ${fld('Reason',`<select class="select" name="reason"><option value="">Choose a reason…</option>${ADJ_REASONS.map(r=>`<option>${r}</option>`).join('')}</select>`,{req:1,hint:'Recorded as its own movement type, e.g. Damaged Stock'})}
      ${fld('Reference',`<input class="input" name="reference" placeholder="Optional · e.g. count sheet no.">`)}
      ${fld('Notes',`<textarea class="input" name="notes" placeholder="What happened, e.g. 2 reels crushed in storage"></textarea>`,{req:1,span:1})}
      <div class="span-2 adj-preview" id="adjPreview"></div>
    </div>`,
    onMount:form=>{
      const upd=()=>{
        const v=DB.variants.find(x=>x.id===F(form,'variantId').value), type=F(form,'type').value, q=parseInt0(F(form,'qty').value);
        $('#qtyLabel').textContent={increase:'Quantity to add',decrease:'Quantity to remove',set:'New quantity'}[type];
        if(!v){$('#adjPreview').innerHTML='<span class="muted">Choose a SKU to see the result.</span>';return}
        const next=isNaN(q)?null:type==='increase'?v.qty+q:type==='decrease'?v.qty-q:q, ch=next===null?null:next-v.qty, r=F(form,'reason').value;
        $('#adjPreview').innerHTML=`<div><span>Current Stock</span><b>${n0(v.qty)}</b></div><div><span>Quantity Change</span><b class="${ch>0?'chg-in':ch<0?'chg-out':''}">${ch===null?'—':(ch>0?'+':ch<0?'−':'')+n0(Math.abs(ch))}</b></div><div><span>Expected New Stock</span><b class="${next!==null&&next<0?'chg-out':''}">${next===null?'—':n0(next)}</b></div><div><span>Recorded as</span><b style="font-size:14px">${r?MOVEMENT_TYPES[ADJ_TYPE[r]||'adjustment'].label:'—'}</b></div>`;
      };
      form.addEventListener('input',upd); form.addEventListener('change',upd);
      form.addEventListener('click',e=>{const b=e.target.closest('[data-adjtype]');if(!b)return;form.querySelectorAll('[data-adjtype]').forEach(x=>x.setAttribute('aria-pressed',x===b));F(form,'type').value=b.dataset.adjtype;upd()});
      upd();
    },
    onSave:form=>{
      const f=n=>F(form,n);
      const v=DB.variants.find(x=>x.id===f('variantId').value), type=f('type').value, q=parseInt0(f('qty').value), reason=f('reason').value, date=f('date').value, notes=f('notes').value.trim();
      let ok=true;
      if(!v){fieldError(f('variantId'),'Choose the SKU to adjust.');ok=false}
      if(isNaN(q)||q<0){fieldError(f('qty'),'Enter a whole number, 0 or more.');ok=false}
      else if(type!=='set'&&q===0){fieldError(f('qty'),'Enter a quantity greater than 0.');ok=false}
      if(!reason){fieldError(f('reason'),'Choose a reason for this adjustment.');ok=false}
      if(!notes){fieldError(f('notes'),'Add a short note so the change can be explained later.');ok=false}
      if(!date){fieldError(f('date'),'Choose a date.');ok=false} else if(date>todayISO()){fieldError(f('date'),'The date cannot be in the future.');ok=false}
      if(!ok){formAlert('Please fix the highlighted fields.');return false}
      const change=type==='increase'?q:type==='decrease'?-q:q-v.qty;
      if(change===0){fieldError(f('qty'),`Stock is already ${v.qty}. Nothing to change.`);return false}
      if(v.qty+change<0){fieldError(f('qty'),`Only ${v.qty} in stock. You can remove at most ${v.qty}.`);formAlert('This stock adjustment would create negative inventory.');return false}
      const m=postMovement(DB,v.id,{type:ADJ_TYPE[reason]||'adjustment',change,date,reason,notes,reference:f('reference').value.trim()});
      audit(DB,{action:'Stock adjusted',entity:'Stock Movement',ref:m.ref,link:'movement-'+m.id,desc:`${v.sku}: ${m.prevQty} → ${m.newQty} (${change>0?'+':'−'}${Math.abs(change)}) · ${reason}`});
      persist(); render();
      toast('Stock adjusted successfully',`${v.sku}: ${m.prevQty} → ${m.newQty} (${reason}) · ${m.ref}`);
      return true;
    }});
}

  showModal({title:'Customer Return',desc:'Returns start from the original completed sale, so quantities and values match what was sold.',narrow:true,save:'Continue',saveIcon:'arrow-right',
    body:sales.length?fld('Original Sale',`<select class="select" name="saleId"><option value="">Choose a completed sale…</option>${sales.map(s=>`<option value="${s.id}">${esc(s.no)} · ${esc(customerOf(s).name)} · ${fmtDate(s.completedDate)} · ${n0(saleTotals(s).units)} units</option>`).join('')}</select>`,{req:1,span:1}):'<div class="empty"><b>No completed sales with items left to return</b></div>',
    onSave:form=>{const sel=F(form,'saleId');if(!sel)return true;if(!sel.value){fieldError(sel,'Choose the sale being returned.');return false}const id=sel.value;closeModal();openCustomerReturn(id);return false}});
}
function openCustomerReturn(saleId){
  const s=DB.sales.find(x=>x.id===saleId);
  if(!s||s.status!=='Completed'){toast('Return not possible','Returns can only be made against a completed sale.','error');return}
  const rows=s.lines.map(l=>({l,v:variantById(l.variantId),max:l.qty-returnedQty(DB,l.id)}));
  showModal({title:`Return from ${esc(s.no)}`,wide:true,save:'Save Return',saveIcon:'undo-2',desc:`${esc(customerOf(s).name)} · sold ${fmtDate(s.completedDate)}. Choose what came back and its condition. Resellable units go back into stock; damaged or unusable units are recorded but not restocked.`,
    body:`<div class="form-grid cols-3">
      ${fld('Return Date',`<input class="input" type="date" name="date" value="${todayISO()}" max="${todayISO()}">`,{req:1})}
      ${fld('Reason',`<select class="select" name="reason"><option value="">Choose a reason…</option>${RETURN_REASONS.map(r=>`<option>${r}</option>`).join('')}</select>`,{req:1})}
      ${fld('Status',`<select class="select" name="status"><option>Completed</option><option>Draft</option></select>`,{hint:'Draft returns do not change stock'})}
      ${fld('Notes',`<textarea class="input" name="notes" placeholder="Optional · what the customer said, courier details"></textarea>`,{span:1})}</div>
    <div class="table-wrap" style="border:1px solid var(--line);border-radius:12px"><table><thead><tr><th>Item</th><th class="num">Sold</th><th class="num">Already Returned</th><th class="num" style="width:110px">Return Qty</th><th style="width:150px">Condition</th><th>Stock</th><th class="num">Stock Now</th><th class="num">After</th></tr></thead><tbody>

function readCurrency(form,name){const s=F(form,name);return s.value==='__other'?F(form,name+'Other').value.trim().toUpperCase():s.value}
function wireCurrency(form){form.addEventListener('change',e=>{if(e.target.matches('[data-currency]')){const o=F(form,e.target.name+'Other');o.style.display=e.target.value==='__other'?'':'none';if(e.target.value==='__other')o.focus()}})}
function checkCurrency(form,name){const c=readCurrency(form,name);if(!/^[A-Z]{3}$/.test(c)){fieldError(F(form,F(form,name).value==='__other'?name+'Other':name),'Use a 3-letter currency code, e.g. AUD.');return null}if(!DB.currencies.includes(c))DB.currencies.push(c);return c}

      form.addEventListener('mousedown',e=>{if(e.target.closest('[data-opt]'))e.preventDefault()});
      form.addEventListener('click',e=>{
        const o=e.target.closest('[data-opt]'); if(o){pick(o.closest('[data-pline]'),o.dataset.opt);return}
        if(e.target.closest('[data-action=addPLine]')){$('#pLines').insertAdjacentHTML('beforeend',pLineHtml({},curNow()));refreshIcons();$('#pLines').lastElementChild.querySelector('[data-l=search]').focus();return}
        const rm=e.target.closest('[data-action=removePLine]'); if(rm){rm.closest('[data-pline]').remove();if(!$('#pLines').children.length)$('#pLines').insertAdjacentHTML('beforeend',pLineHtml({},curNow()));refreshIcons();recalcP();return}

function snapshotPurchaseForm(form){
  const lines=[...form.querySelectorAll('[data-pline]')].map(r=>({variantId:r.querySelector('[data-l=variant]').value,qty:parseInt0(r.querySelector('[data-l=qty]').value)||'',unitCost:r.querySelector('[data-l=cost]').value})).filter(l=>l.variantId);
  return {supplierId:F(form,'supplierId').value,currency:readCurrency(form,'currency'),notes:F(form,'notes').value,lines:lines.length?lines:[{}],costs:{...emptyCosts(),...Object.fromEntries(COST_FIELDS.map(([k])=>[k,parseMoney(F(form,'cost_'+k).value)||0])),otherDesc:F(form,'otherDesc').value}};
}
function readPurchaseForm(form,{editing,locked}){
  let ok=true; const bad=(el,m)=>{fieldError(el,m);ok=false};
  const supplierId=F(form,'supplierId').value, date=F(form,'date').value, expectedDate=F(form,'expectedDate').value, status=editing?null:F(form,'status').value;
  if(!supplierId) bad(F(form,'supplierId'),'Choose a supplier.');
  if(!date) bad(F(form,'date'),'Purchase date is required.');
  else if(status==='Received'&&date>todayISO()) bad(F(form,'date'),'A received purchase cannot be dated in the future.');
  if(date&&expectedDate&&expectedDate<date) bad(F(form,'expectedDate'),'Expected arrival cannot be before the purchase date.');
  const currency=locked?readCurrency(form,'currency'):checkCurrency(form,'currency'); if(!currency) ok=false;
  const costs=emptyCosts();
  COST_FIELDS.forEach(([k])=>{const el=F(form,'cost_'+k),raw=el.value.trim();if(!raw)return;const n=parseMoney(raw);if(isNaN(n)||n<0)bad(el,'Enter an amount of 0 or more.');else costs[k]=n});
  costs.otherDesc=F(form,'otherDesc').value.trim();
  const rows=[...form.querySelectorAll('[data-pline]')], lines=[];
  rows.forEach(r=>{
    const s=r.querySelector('[data-l=search]'), vid=r.querySelector('[data-l=variant]').value, qEl=r.querySelector('[data-l=qty]'), cEl=r.querySelector('[data-l=cost]');
    if(!vid&&!s.value.trim()&&!qEl.value&&!cEl.value) return;
    const q=parseInt0(qEl.value), uc=parseMoney(cEl.value);
    if(!vid) bad(s,'Choose a product and variant from the list.');
    if(isNaN(q)||q<=0) bad(qEl,'Quantity must be a whole number greater than 0.');
    if(isNaN(uc)) bad(cEl,'Enter a unit cost.'); else if(uc<0) bad(cEl,'Unit cost cannot be negative.');
    lines.push({row:r,variantId:vid,qty:q,unitCost:uc});
  });
  if(!lines.length){formAlert('Add at least one item to this purchase.');return null}
  if(!ok){formAlert('Please fix the highlighted fields.');return null}
  const merged=[]; let combined=0;
  for(const l of lines){
    const prev=merged.find(m=>m.variantId===l.variantId);
    if(!prev){merged.push({...l});continue}
    if(prev.unitCost===l.unitCost){prev.qty+=l.qty;combined++;continue}
    bad(l.row.querySelector('[data-l=search]'),'This SKU is already on the purchase with a different unit cost. Use one line per SKU.');
  }
  if(!ok){formAlert('Please fix the highlighted fields.');return null}
  return {supplierId,date,expectedDate,invoiceNo:F(form,'invoiceNo').value.trim(),currency,status,notes:F(form,'notes').value.trim(),costs,lines:merged.map(({row,...l})=>l),combined,updateCost:!!(F(form,'updateCost')&&F(form,'updateCost').checked)};
}

/* --- Status actions --- */
function openReceive(id){
  const p=DB.purchases.find(x=>x.id===id), t=purchaseTotals(p);
  if(!['Draft','Ordered'].includes(p.status)){toast('Already received',`${p.no} is ${p.status.toLowerCase()}. Stock is only added once.`,'error');return}
  showModal({title:`Receive ${esc(p.no)}`,desc:`Adds ${n0(t.units)} units from ${esc(supplierOf(p).name)} to inventory. This happens once and can only be undone with Reverse Purchase.`,save:'Receive Stock',saveIcon:'package-check',
    body:`<div class="form-grid">${fld('Date Received',`<input class="input" type="date" name="date" value="${todayISO()}" max="${todayISO()}">`,{req:1})}
      <div class="field" style="justify-content:flex-end">${p.currency===BASE_CURRENCY?`<label class="check" style="white-space:normal"><input type="checkbox" name="updateCost">Also set each item's cost price to its unit cost here</label>`:`<span class="field-hint">Costs are in ${esc(p.currency)}, so item cost prices (SGD) are not changed. The unit cost is saved as each item's last purchase cost.</span>`}</div></div>
      <div class="table-wrap" style="border:1px solid var(--line);border-radius:12px"><table><thead><tr><th>Item</th><th class="num">Receiving</th><th class="num">Stock now</th><th class="num">After</th></tr></thead><tbody>
      ${p.lines.map(l=>{const L=purchaseLineLabel(l);return `<tr><td><span class="strong">${esc(L.name)}</span><span class="cell-sub">${esc(L.variant)} · ${esc(L.sku)}</span></td><td class="num strong chg-in">+${n0(l.qty)}</td><td class="num muted">${L.v?n0(L.v.qty):'—'}</td><td class="num strong">${L.v?n0(L.v.qty+l.qty):'—'}</td></tr>`}).join('')}
      </tbody></table></div>`,
    onSave:form=>{
      const date=F(form,'date').value;
      if(!date){fieldError(F(form,'date'),'Choose the date the stock arrived.');return false}
      if(date>todayISO()){fieldError(F(form,'date'),'The date cannot be in the future.');return false}
      if(date<p.date){fieldError(F(form,'date'),`Stock can't arrive before the purchase date (${fmtDate(p.date)}).`);return false}
      try{const uc=!!(F(form,'updateCost')&&F(form,'updateCost').checked);const u=transact(()=>receivePurchase(DB,DB.purchases.find(x=>x.id===id),{date,updateCost:uc}));persist();render();toast('Purchase received successfully',`${p.no} · ${n0(u)} units added to inventory.`);return true}
      catch(err){formAlert(err.message);return false}
    }});
}
function openReverse(id){
  const p=DB.purchases.find(x=>x.id===id), short=reversalShortfalls(DB,p), t=purchaseTotals(p);
  const REASONS=['Recorded in error','Wrong supplier or invoice','Goods returned to supplier','Duplicate entry','Other'];
  showModal({title:`Reverse ${esc(p.no)}`,desc:`Removes the ${n0(t.units)} units this purchase added. The original receipt stays in the history and new reversal movements are recorded.`,save:'Reverse Purchase',saveIcon:'undo-2',danger:true,
    body:`${short.length?`<div class="notice" style="background:var(--bad-bg);color:var(--bad-fg)">${ic('circle-alert','i i-sm')}Reversal is blocked: some of this stock has already left inventory, so reversing would make stock negative. Adjust stock or record the correction another way first.</div>`:''}

function snapshotSaleForm(form){

  return {customerId:F(form,'customerId').value,country:F(form,'country').value,currency:readCurrency(form,'currency'),fxRate:F(form,'fxRate').value,notes:F(form,'notes').value,lines:lines.length?lines:[{}],
    charges:{discount:parseMoney(F(form,'ch_discount').value)||0,shipping:parseMoney(F(form,'ch_shipping').value)||0,other:parseMoney(F(form,'ch_other').value)||0,otherDesc:F(form,'otherDesc').value}};

function readSaleForm(form,{editing,locked}){
  let ok=true; const bad=(el,m)=>{fieldError(el,m);ok=false};
  const customerId=F(form,'customerId').value, date=F(form,'date').value, status=editing?null:F(form,'status').value;
  if(!customerId) bad(F(form,'customerId'),'Choose a customer.');
  if(!date) bad(F(form,'date'),'Sale date is required.');
  else if(status==='Completed'&&date>todayISO()) bad(F(form,'date'),'A completed sale cannot be dated in the future.');
  const currency=locked?readCurrency(form,'currency'):checkCurrency(form,'currency'); if(!currency) ok=false;
  let fxRate=1;
  if(currency&&currency!==BASE_CURRENCY){fxRate=parseFloat(F(form,'fxRate').value);if(!(fxRate>0))bad(F(form,'fxRate'),`Enter how many SGD 1 ${currency} is worth, e.g. 0.29.`)}
  const charges=emptyCharges();
  [['discount','ch_discount'],['shipping','ch_shipping'],['other','ch_other']].forEach(([k,n])=>{const el=F(form,n),raw=el.value.trim();if(!raw)return;const v=parseMoney(raw);if(isNaN(v)||v<0)bad(el,'Enter an amount of 0 or more.');else charges[k]=v});
  charges.otherDesc=F(form,'otherDesc').value.trim();
  const lines=[];
  form.querySelectorAll('[data-sline]').forEach(r=>{
    const sEl=r.querySelector('[data-l=search]'), vid=r.querySelector('[data-l=variant]').value, qEl=r.querySelector('[data-l=qty]'), pEl=r.querySelector('[data-l=price]'), dEl=r.querySelector('[data-l=disc]');
    if(!vid&&!sEl.value.trim()&&!qEl.value&&!pEl.value&&!dEl.value) return;
    const q=parseInt0(qEl.value), p=parseMoney(pEl.value), dsc=dEl.value.trim()?parseMoney(dEl.value):0;
    if(!vid) bad(sEl,'Choose a product and variant from the list.');
    if(isNaN(q)||q<=0) bad(qEl,'Quantity must be a whole number greater than 0.');
    if(isNaN(p)) bad(pEl,'Enter a selling price.'); else if(p<0) bad(pEl,'Selling price cannot be negative.');
    if(isNaN(dsc)||dsc<0) bad(dEl,'Discount cannot be negative.');
    else if(!isNaN(q)&&!isNaN(p)&&dsc>round2(q*p)) bad(dEl,'Discount cannot be more than the line amount.');
    lines.push({row:r,variantId:vid,qty:q,unitPrice:p,discount:dsc||0});
  });
  if(!lines.length){formAlert('Add at least one product to this sale.');return null}
  if(!ok){formAlert('Please fix the highlighted fields.');return null}
  const merged=[]; let combined=0;
  for(const l of lines){
    const prev=merged.find(m=>m.variantId===l.variantId);
    if(!prev){merged.push({...l});continue}
    if(prev.unitPrice===l.unitPrice){prev.qty+=l.qty;prev.discount=round2(prev.discount+l.discount);combined++;continue}
    bad(l.row.querySelector('[data-l=search]'),'This SKU is already on the sale at a different price. Use one line per SKU.');
  }
  const sub=round2(merged.reduce((a,l)=>a+l.qty*l.unitPrice-l.discount,0));
  if(charges.discount>sub) bad(F(form,'ch_discount'),'Order discount cannot be more than the subtotal after line discounts.');
  if(status==='Completed') merged.forEach(l=>{const v=variantById(l.variantId);if(v&&l.qty>v.qty)bad(l.row.querySelector('[data-l=qty]'),v.qty<=0?'This SKU is out of stock.':`Only ${n0(v.qty)} units are currently available.`)});
  if(!ok){formAlert(status==='Completed'&&merged.some(l=>l.qty>(variantById(l.variantId)||{qty:0}).qty)?'Not enough stock to complete this sale. Save it as Draft or Confirmed, or reduce the quantities.':'Please fix the highlighted fields.');return null}
  return {customerId,date,country:F(form,'country').value.trim(),currency,fxRate,status,payment:F(form,'payment').value,reference:F(form,'reference').value.trim(),notes:F(form,'notes').value.trim(),charges,lines:merged.map(({row,...l})=>l),combined};
}

  addSupplier:()=>openSupplierForm(),

  deleteSupplier:d=>{const s=DB.suppliers.find(x=>x.id===d.id);confirmDialog({title:'Delete supplier?',body:`${esc(s.name)} has no purchases, so it can be deleted. This can't be undone.`,confirm:'Delete Supplier',onConfirm:()=>{if(DB.purchases.some(p=>p.supplierId===s.id)){toast('Supplier not deleted','It has purchases. Deactivate it instead.','error');return}DB.suppliers=DB.suppliers.filter(x=>x!==s);persist();go('suppliers');toast('Supplier deleted',s.name)}})},
  gosuppliers:()=>go('suppliers'),

  close:()=>closeModal(), save:()=>submitModal(),

  editProduct:d=>openEditProduct(d.id),
  addVariant:d=>openVariantForm(d.id),
  editVariant:d=>{const v=DB.variants.find(x=>x.id===d.id);openVariantForm(v.productId,v.id)},

  toggleProduct:d=>{const p=DB.products.find(x=>x.id===d.id);p.status=p.status==='Active'?'Inactive':'Active';audit(DB,{action:p.status==='Active'?'Product reactivated':'Product deactivated',entity:'Product',ref:p.name,link:'product-'+p.id});persist();render();toast(p.status==='Active'?'Product reactivated':'Product deactivated',p.status==='Active'?`${p.name} is available again.`:`${p.name} is hidden from new transactions. Its history is kept.`)},
  toggleVariant:d=>{const v=DB.variants.find(x=>x.id===d.id);v.status=v.status==='Active'?'Inactive':'Active';audit(DB,{action:v.status==='Active'?'Variant reactivated':'Variant deactivated',entity:'Variant',ref:v.sku,link:'variant-'+v.id});persist();render();toast(v.status==='Active'?'Variant reactivated':'Variant deactivated',`${v.sku} · ${variantLabel(v)}`)},

  restoreSample:()=>confirmDialog({title:'Restore sample data?',body:'This replaces all products, suppliers, purchases, customers, sales and stock movements in this browser with the MSV sample data.',confirm:'Restore Sample Data',onConfirm:()=>{DB=seedDb();persist();render();toast('Sample data restored','')}}),
  clearData:()=>confirmDialog({title:'Clear all data?',body:'This removes every product, supplier, purchase, customer, sale and stock movement saved in this browser. Categories and currencies are kept. This can\'t be undone.',confirm:'Clear Data',onConfirm:()=>{DB=emptyDb();persist();go('products');toast('Data cleared','Add your first product to get started.')}}),

document.addEventListener('click',e=>{
  if(e.target.closest('a[href^="#"]:not([data-action])')&&!e.target.closest('#mForm')) return;
  const el=e.target.closest('[data-action],[data-go],[data-variant],[data-product],[data-vtab],[data-rtab],[data-range],[data-sort],[data-scroll],[data-pstatus],[data-setstatus],[data-psort],[data-sstatus],[data-ssort],[data-drange],[data-dtop],[data-ctype],[data-cstatus],[data-rtabgo],[data-rettab],[data-retstatus]');
  if(!el) return;
  const d=el.dataset;
  if(d.action){ if(['suggestSku','addVariantCard','removeVariantCard','addPLine','removePLine','newSupplierInline','addSLine','removeSLine','newCustomerInline'].includes(d.action)) return; const fn=ACTIONS[d.action]; if(fn){ if(el.tagName==='A'&&d.action==='close'){closeModal();return} e.preventDefault(); fn(d,el);} return; }
  if(d.go){ if(d.status!==undefined) Object.assign(S.inv,blankInvFilters(),{status:d.status,view:'levels'}); if(d.view) S.inv.view=d.view; return go(d.go); }
  if(d.variant) return go('variant-'+d.variant);
  if(d.product) return go('product-'+d.product);
  if(d.vtab){S.vtab=d.vtab;return render();}
  if(d.rtab){S.rtab=d.rtab;return render();}
  if(d.range){S.range=d.range;return render();}
  if(d.pstatus){S.prod.status=d.pstatus;return render();}
  if(d.invview){S.inv.view=d.invview;return render();}
  if(d.setstatus){Object.assign(S.inv,{status:d.setstatus,view:'levels'});return render();}
  if(d.rettab){S.ret.tab=d.rettab;return render();}
  if(d.retstatus!==undefined){S.ret.status=d.retstatus;return render();}
  if(d.ssort){const f=S.sal;f.dir=f.sort===d.ssort?-f.dir:1;f.sort=d.ssort;return renderSalTable();}
  if(d.drange){S.dash.range=d.drange;return render();}
  if(d.dtop){S.dash.top=d.dtop;return render();}
  if(d.ctype){S.cus.type=d.ctype;return render();}
  if(d.cstatus){S.cus.status=d.cstatus;return render();}
  if(d.rtabgo){S.rtab=d.rtabgo;return go('reports');}
  if(d.psort){const f=S.pur;f.dir=f.sort===d.psort?-f.dir:1;f.sort=d.psort;return renderPurTable();}
  if(d.sstatus){S.sup.status=d.sstatus;return render();}
  if(d.sort){const f=S.inv;f.dir=f.sort===d.sort?-f.dir:1;f.sort=d.sort;return renderInvTable();}
  if(d.scroll){e.preventDefault();document.getElementById(d.scroll).scrollIntoView({behavior:'smooth',block:'start'});}
});
function rerenderKeepFocus(id){const el=$('#'+id),pos=el?el.selectionStart:0;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter){S.inv[t.dataset.filter]=t.value;rerenderKeepFocus('invQ');return}
  if(t.dataset.mfilter){S.mov[t.dataset.mfilter]=t.value;S.movLimit=150;rerenderKeepFocus('movQ');return}
  if(t.dataset.vmfilter){S.vmov[t.dataset.vmfilter]=t.value;rerenderKeepFocus('vmovQ');return}
  if(t.id==='cntProd'){S.cnt.prod=t.value;rerenderKeepFocus('cntQ');return}
  if(t.id==='audEnt'){S.aud.entity=t.value;S.audLimit=200;rerenderKeepFocus('audQ');return}
  if(t.dataset.sfilter){S.sal[t.dataset.sfilter]=t.value;rerenderKeepFocus('salQ');return}
  if(t.id==='rFrom'||t.id==='rTo'){S[t.id==='rFrom'?'rfrom':'rto']=t.value;render();return}
  if(t.dataset.fx){const r=parseFloat(t.value);if(r>0){DB.fxRates[t.dataset.fx]=r;persist();toast('Exchange rate updated',`1 ${t.dataset.fx} = ${r} SGD. Completed sales keep their own rate.`)}else toast('Rate not saved','Enter a number greater than 0.','error');return}
  if(t.dataset.pfilter){S.pur[t.dataset.pfilter]=t.value;rerenderKeepFocus('purQ');return}
  if(t.id==='showInactive'){S.inv.showInactive=t.checked;render();return}
  if(t.id==='prodCat'){S.prod.cat=t.value;render();return}
  if(t.dataset.catgauge){const c=DB.categories.find(x=>x.id===t.dataset.catgauge);c.usesGauge=t.checked;persist();render();toast('Category updated',`${c.name} ${c.usesGauge?'now shows':'no longer shows'} the gauge field.`);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='invQ'){S.inv.q=t.value;renderInvTable();const rb=document.querySelector('[data-action=resetInv]');if(rb)rb.disabled=!filtersActive();return}
  if(t.id==='movQ'){S.mov.q=t.value;S.movLimit=150;renderMovTable();const rb=document.querySelector('[data-action=resetMov]');if(rb)rb.disabled=!movFiltersActive();return}
  if(t.id==='vmovQ'){S.vmov.q=t.value;rerenderKeepFocus('vmovQ');return}
  if(t.id==='cntQ'){S.cnt.q=t.value;rerenderKeepFocus('cntQ');return}
  if(t.id==='retQ'){S.ret.q=t.value;rerenderKeepFocus('retQ');return}
  if(t.id==='audQ'){S.aud.q=t.value;S.audLimit=200;rerenderKeepFocus('audQ');return}
  if(t.dataset.count){const id=t.dataset.count,v=variantById(id);S.cnt.counts[id]=t.value.trim();const cell=document.querySelector(`[data-var="${id}"]`);if(cell)cell.innerHTML=varianceHtml(v,S.cnt.counts[id]);const one=document.querySelector(`[data-action=applyOneCount][data-id="${id}"]`);if(one)one.disabled=S.cnt.counts[id]==='';
    const n=Object.keys(S.cnt.counts).filter(k=>S.cnt.counts[k]!=='').length,ab=document.querySelector('[data-action=applyCounts]');if(ab){ab.disabled=!n;ab.lastChild.textContent=`Review and Apply${n?` (${n})`:''}`}const cb=document.querySelector('[data-action=clearCounts]');if(cb)cb.disabled=!n;return}
  if(t.id==='salQ'){S.sal.q=t.value;renderSalTable();const rb=document.querySelector('[data-action=resetSal]');if(rb)rb.disabled=!salFiltersActive();return}
  if(t.id==='cusQ'){S.cus.q=t.value;rerenderKeepFocus('cusQ');return}
  if(t.id==='purQ'){S.pur.q=t.value;renderPurTable();const rb=document.querySelector('[data-action=resetPur]');if(rb)rb.disabled=!purFiltersActive();return}
  if(t.id==='supQ'){S.sup.q=t.value;rerenderKeepFocus('supQ');return}
  if(t.id==='prodQ'){S.prod.q=t.value;rerenderKeepFocus('prodQ');return}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='mForm'){e.preventDefault();submitModal();return}
  if(e.target.id==='addCurForm'){e.preventDefault();const c=e.target.querySelector('[name=code]').value.trim().toUpperCase(),err=$('#curErr');
    if(!/^[A-Z]{3}$/.test(c)){err.textContent='Use a 3-letter code, e.g. AUD.';return}
    if(DB.currencies.includes(c)){err.textContent='That currency is already on the list.';return}
    DB.currencies.push(c);persist();render();toast('Currency added',c);return}
  if(e.target.id==='addCatForm'){e.preventDefault();const n=e.target.querySelector('[name=name]').value.trim(),err=$('#catErr');
    if(!n){err.textContent='Enter a category name.';return}
    if(DB.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){err.textContent='That category already exists.';return}
    DB.categories.push({id:uid('cat'),name:n,usesGauge:false});persist();render();toast('Category added',n);}
});
$('#globalSearch').addEventListener('submit',e=>{e.preventDefault();Object.assign(S.inv,blankInvFilters(),{q:$('#globalSearchInput').value,view:'levels'});$('#globalSearchInput').value='';go('inventory');});

  if(e.key==='Escape'){ if(modal) closeModal(); hidePops(); }

function renderNotifications(){
  const att=attention(), out=att.filter(v=>v.qty<=0).length;
  $('#notifDot').hidden=!att.length&&!ledgerCheck().length;
  $('#notifPop').innerHTML=`<div class="pop-head">Notifications</div>
  ${att.length?`<button class="pop-item" data-go="inventory" data-status="attention"><span class="act-icon" style="background:var(--warn-bg);color:var(--warn-fg)">${ic('triangle-alert','i i-sm')}</span><span><b style="font-size:13.5px">${att.length} SKU${att.length===1?' needs':'s need'} reordering</b><small>${out} out of stock</small></span></button>`:`<div class="pop-item" style="cursor:default"><span class="act-icon" style="background:var(--ok-bg);color:var(--ok-fg)">${ic('circle-check','i i-sm')}</span><span><b style="font-size:13.5px">Stock levels look good</b><small>No SKU is at its reorder level</small></span></div>`}
  ${(()=>{const iss=ledgerCheck();return iss.length?`<button class="pop-item" data-go="movements"><span class="act-icon" style="background:var(--bad-bg);color:var(--bad-fg)">${ic('triangle-alert','i i-sm')}</span><span><b style="font-size:13.5px">Inventory discrepancy on ${iss.length} SKU${iss.length===1?'':'s'}</b><small>Stock and movement history don't match</small></span></button>`:''})()}
  ${DB.returns.some(r=>r.status==='Draft')||DB.supplierReturns.some(r=>r.status==='Draft')?`<button class="pop-item" data-go="returns"><span class="act-icon" style="background:var(--info-bg);color:var(--info-fg)">${ic('undo-2','i i-sm')}</span><span><b style="font-size:13.5px">Draft returns waiting</b><small>Complete them to update stock</small></span></button>`:''}
  ${DB.purchases.some(p=>p.status==='Ordered')?`<button class="pop-item" data-go="purchases"><span class="act-icon" style="background:var(--info-bg);color:var(--info-fg)">${ic('ship','i i-sm')}</span><span><b style="font-size:13.5px">${DB.purchases.filter(p=>p.status==='Ordered').length} purchase${DB.purchases.filter(p=>p.status==='Ordered').length===1?'':'s'} on order</b><small>Mark as Received when the stock arrives</small></span></button>`:''}
  ${(()=>{const u=DB.sales.filter(x=>x.status==='Completed'&&(x.payment==='Unpaid'||x.payment==='Partially Paid'));return u.length?`<button class="pop-item" data-go="sales"><span class="act-icon" style="background:var(--bad-bg);color:var(--bad-fg)">${ic('clock','i i-sm')}</span><span><b style="font-size:13.5px">${u.length} completed sale${u.length===1?'':'s'} awaiting payment</b><small>${sgd(Math.round(u.reduce((a,x)=>a+saleTotals(x).totalBase,0)))} outstanding</small></span></button>`:''})()}
  ${DB.sales.some(x=>x.status==='Confirmed')?`<button class="pop-item" data-go="sales"><span class="act-icon" style="background:var(--info-bg);color:var(--info-fg)">${ic('clipboard-check','i i-sm')}</span><span><b style="font-size:13.5px">${DB.sales.filter(x=>x.status==='Confirmed').length} confirmed sale${DB.sales.filter(x=>x.status==='Confirmed').length===1?'':'s'} to ship</b><small>Complete them when the goods leave</small></span></button>`:''}`;
}
